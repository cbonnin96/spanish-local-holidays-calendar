name: Update Palma holidays calendar

on:
  schedule:
    # Every Monday at 06:00 UTC -- holiday data changes rarely, so a weekly
    # check is enough to catch new publications (e.g. a new year's calendar).
    - cron: "0 6 * * 1"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=src python -m pytest

      - name: Generate calendar
        run: PYTHONPATH=src python -m spanish_local_holidays_calendar

      - name: Commit updated calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/palma.ics
          git diff --staged --quiet || git commit -m "Update Palma holidays calendar"
          git push
