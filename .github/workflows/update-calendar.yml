name: Update holiday calendars

on:
  schedule:
    # 06:00 UTC on the 1st of every month -- holiday data changes rarely, so
    # a monthly check is enough to catch new publications (e.g. a new year's
    # calendar, usually published months in advance).
    - cron: "0 6 1 * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "spanish_local_holidays_calendar/**"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Generate calendar
        run: python -m spanish_local_holidays_calendar

      - name: Commit updated calendar if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update holiday calendars"
          git push
